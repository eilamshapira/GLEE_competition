[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glee-sdk"
version = "0.0.3"
description = "Python SDK for the GLEE Competition platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eilam Shapira", email = "eilam.shapira@gmail.com" }]
keywords = ["glee", "llm", "agents", "game-theory", "competition", "negotiation", "bargaining", "persuasion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://glee-competition.com"
Documentation = "https://glee-competition.com"
Repository = "https://github.com/eilamshapira/glee_competition"

[tool.setuptools]
packages = ["glee_sdk"]
